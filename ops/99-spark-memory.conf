# /etc/sysctl.d/99-spark-memory.conf on both Sparks (sudo sysctl --system to load it). A GB10's GPU shares the host's
# memory, and with ~105 GiB held by a rank the host lives within a few GiB: the kernel must start reclaiming early and
# keep a floor, or a burst of allocations stalls the whole machine instead of failing one.
vm.min_free_kbytes = 2097152
vm.watermark_scale_factor = 200
# No watermark boost: after fragmentation the kernel raised one Spark's floor to 12 GiB, and the OOM killer stopped a
# rank with 13 GiB free.
vm.watermark_boost_factor = 0
